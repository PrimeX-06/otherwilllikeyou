<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们的故事 · 第二幕</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1c25;color:#f9efdf;font-family:'Microsoft YaHei',system-ui,sans-serif}main{width:min(96vw,1200px)}header,footer{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;gap:12px}h1{font-size:20px;margin:0}header span,footer{font-size:13px;color:#d4c3b1}button{cursor:pointer;font:inherit;color:#fff4e5;background:#4a3839;border:1px solid #c69e80;border-radius:5px;padding:7px 12px}button:hover,button:focus-visible{background:#805643;outline:1px solid #ffe2b3}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#4b677f;border:1px solid #a88c78;box-shadow:0 20px 55px #0009}.stage{background:linear-gradient(#4282b9,#b7d2db 70%,#e5bf9d)}.stage>img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}.stage>img.camera-down{animation:cameraDown 5s ease-in-out both}.stage>img.cg-reveal{animation:cgReveal .7s ease-out both}@keyframes cgReveal{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}.stage>img.look-door,.stage>img.look-door ~ #people{transform:scale(1.18) translateX(8%);transform-origin:20% 45%;transition:transform 1.2s ease}#people{position:absolute;inset:0;z-index:2;pointer-events:none;transition:transform 1.2s ease}#openDoor{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;pointer-events:none;clip-path:inset(13% 81% 40% 1.5%);opacity:0;transition:opacity .85s}#openDoor.open{opacity:1}#doorLeaf{position:absolute;left:5.7%;top:16.7%;width:11.2%;height:40%;z-index:2;pointer-events:none;transform-origin:left center;image-rendering:pixelated}#doorLeaf.swing{animation:doorSwing .95s ease-in-out forwards}@keyframes doorSwing{from{transform:perspective(500px) rotateY(0);opacity:1}to{transform:perspective(500px) rotateY(-83deg);opacity:0}}@keyframes cameraDown{0%{transform:translateY(85%) scale(1.12)}100%{transform:translateY(0) scale(1)}}.hot{position:absolute;z-index:3;transf r.waving{animation:herWave .5s steps(1) infinite}@keyframes herWave{0%,49%{background-position:95.8333% top}50%,100%{background-position:100% top}}.extra{position:absolute;z-index:2;aspect-ratio:2/3;background:url("assets/characters/npc_generated/boy_sit.gif") no-repeat left top;background-size:100% 100%;image-rendering:pixelated;filter:drop-shadow(1px 2px 1px #0007)}.extra.girl{background-image:url("assets/characters/npc_generated/girl_sit.gif")}.door-controls{position:absolute;z-index:5;right:2%;bottom:2%;background:#20232aee;border:1px solid #c7aa8b;border-radius:6px;padding:10px;max-width:44%;font-size:13px}.door-controls p{margin:0 0 7px}.door-controls .row{margin:0}.board-ui{position:absolute;z-index:5;left:6%;right:6%;bottom:2%;background:#20232aeb;border:1px solid #c7aa8b;padding:8px;border-radius:6px}.board-ui p{margin:3px}.board-in-room{position:absolute;z-index:4;left:44.8%;top:14%;width:22%;height:24.6%;background:#285147;image-rendering:pixelated;touch-action:none;border:2px solid #765442}.end{position:absolute;inset:0;background:#17171c;display:grid;place-content:center;text-align:center;gap:14px;font-size:clamp(20px,4vw,42px)}.end small{font-size:14px;color:#cbb8a8}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar button{font-size:13px;background:#303039}.note{color:#d3bcaa;font-size:13px}body.paused .stage:after{content:'已暂停';position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:#19191fe0;font-size:32px}@media(max-width:600px){main{width:100%}.panel{inset:2%;padding:8px}h1{font-size:16px}}
</style></head><body><main><header><h1>我们的故事 · 第二幕</h1><span>CHAPTER 02 / ORDINARY DAYS</span><button id="restart">从头开始</button></header><div class="stage"><img id="bg" alt=""><img id="openDoor" src="assets/scenes/school_classroom_open_pixel.png" alt="" hidden><img id="doorLeaf" src="assets/scenes/classroom_door_leaf.png" alt="" hidden><div id="people"></div><div id="ui"></div></div><footer><span id="status">E 推进；Enter 继续对白</span><button id="pause">暂停</button></footer></main><script>
const I='assets/scenes/',images={exterior:I+'school_exterior_pixel.png',door:I+'school_corridor_door_pixel.png',railing:I+'school_corridor_railing_pixel.png',classroom:I+'school_classroom_pixel.png',cg:I+'cg_doorway_wave_v2.png',lean:I+'cg_corridor_lean_back.png',leanTurn:I+'lean_turn/frame_00.png'};const leanFrames=Array.from({length:8},(_,i)=>I+'lean_turn/frame_'+String(i).padStart(2,'0')+'.png');leanFrames.forEach(src=>{let im=new Image();im.src=src});const bg=document.getElementById('bg'),openDoor=document.getElementById('openDoor'),doorLeaf=document.getElementById('doorLeaf'),people=document.getElementById('people'),ui=document.getElementById('ui'),status=document.getElementById('status');const KEY='our-story-act2-corridor-flow-v2';let state='sky',talk=null,promptAction=null,paused=false,boardImage='',snack='',miss=0,walking=0,follow=0,raf=0,timer=0;
function persist(){try{localStorage.setItem(KEY,JSON.stringify({state,boardImage,snack,miss}))}catch{}}function go(s){if(paused)return;clearTimeout(timer);cancelAnimationFrame(raf);state=s;persist();render()}function scene(s){document.querySelector('.stage').classList.toggle('corridor-view',s==='railing'||s==='door');bg.hidden=false;bg.className='';bg.src=images[s];bg.alt=s;ui.replaceChildren();people.replaceChildren();openDoor.classList.remove('open');doorLeaf.classList.remove('swing');openDoor.hidden=true;doorLeaf.hidden=true;if(s==='classroom')classroomCrowd();if(s!=='cg'&&s!=='lean'&&s!=='leanTurn'&&s!=='railing')pixelate(bg,images[s])}const pixelCache=new Map();function pixelate(el,src){if(pixelCache.has(src)){el.src=pixelCache.get(src);return}let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=384;c.height=216;let cx=c.getContext('2d');cx.imageSmoothingEnabled=false;cx.drawImage(im,0,0,384,216);let out=c.toDataURL('image/png');pixelCache.set(src,out);if(el===bg&&images[bg.alt]===src)el.src=out};im.src=src}function showDoor(animate=false){openDoor.hidden=false;if(animate){doorLeaf.hidden=false;void doorLeaf.offsetWidth;requestAnimationFrame(()=>{openDoor.classList.add('open');doorLeaf.classList.add('swing')})}else{openDoor.classList.add('open');doorLeaf.hidden=true}}function button(label,x,y,fn){promptAction=fn;let b=document.createElement('div');b.className='hot';b.textContent='E · '+label;b.style.left=x+'%';b.style.top=y+'%';ui.append(b);return b}function panel(title,desc){let d=document.createElement('div');d.className='panel';d.innerHTML='<h2></h2><p></p>';d.querySelector('h2').textContent=title;d.querySelector('p').textContent=desc;ui.append(d);return d}function add(host,label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;host.append(b);return b}function row(host){let d=document.createElement('div');d.className='row';host.append(d);return d}function extra(x,bottom,width,girl){let a=document.createElement('div');a.className='extra'+(girl?' girl':'');a.style.left=x+'%';a.style.bottom=bottom+'%';a.style.width=width+'%';a.setAttribute('aria-label','其他学生坐在座位上');people.append(a);return a}function classroomCrowd(){let seats=[18.4,34.2,50,65.2,80.4],rows=[{bottom:36.5,width:5.2},{bottom:20.1,width:6},{bottom:3.4,width:6.7}];rows.forEach((row,r)=>seats.forEach((x,c)=>{if(r===1&&c===1)return;extra(x,row.bottom,row.width,(r+c)%2===0)}))}function actor(who,x){let a=document.createElement('div');a.className='actor '+who;a.style.left=x+'%';a.setAttribute('aria-label',who==='me'?'我':'她');people.append(a);return a}
function lines(items,end){let i=0,box=document.createElement('div');box.className='dialog';ui.append(box);talk=box;function put(){if(i>=items.length){box.remove();talk=null;end?.();return}let [who,text]=items[i++];box.innerHTML='<b></b><p></p><small>E / Enter 继续</small>';box.querySelector('b').textContent=who;let p=box.querySelector('p'),j=0;function type(){if(!box.isConnected)return;p.textContent=text.slice(0,++j);if(j<text.length)timer=setTimeout(type,who==='旁白'?80:52)}type();box.onclick=()=>{if(p.textContent.length<text.length){clearTimeout(timer);p.textContent=text}else put()}}put()}
function walkActorToDoor(me){me.classList.add('moving');let x=33,depth=20,steps=0,done=false;const AISLE=12.6,TOP=43;let p=document.createElement('div');p.className='door-controls';p.innerHTML='<p>按 E 一步步走到门前。方向键 / WASD 也可以自己走。</p>';ui.append(p);function move(dir){if(done||state!=='walkToDoor')return;let before=x+depth;if(dir==='left'&&depth===20)x=Math.max(AISLE,x-4.1);else if(dir==='right'&&depth===20)x=Math.min(33,x+4.1);else if(dir==='up'&&x<=AISLE)depth=Math.min(TOP,depth+4.6);else if(dir==='down'&&depth>20)depth=Math.max(20,depth-4.6);if(before===x+depth){status.textContent=x>AISLE?'先向左走出座位':'沿通道向门口走';return}let progress=(depth-20)/(TOP-20);me.style.left=(depth>20?AISLE+2.1*progress:x)+'%';me.style.bottom=depth+'%';let base={left:9,right:13,up:17,down:5}[dir];me.style.backgroundPosition=((base+(steps++%4))/22*100)+'% top';if(depth>=TOP){done=true;status.textContent='已经走到门前';setTimeout(()=>{if(state==='walkToDoor')go('doorArrival')},450)}}window.doorMove=move;window.doorAdvance=()=>{if(done||state!=='walkToDoor')return;move(x>AISLE+0.01?'left':'up')}}function animateExitClassroom(){scene('classroom');showDoor();let her=actor('her',7),me=actor('me',14.7);her.classList.add('at-door','exiting');me.classList.add('exiting');me.style.bottom='43%';me.style.backgroundPosition=(9/22*100)+'% top';her.style.backgroundPosition=(9/24*100)+'% top';requestAnimationFrame(()=>{her.style.left='1.5%';her.style.bottom='47%';her.style.width='4.5%';her.style.opacity='0';setTimeout(()=>{if(state!=='exitClassroom')return;me.style.left='6%';me.style.bottom='47%';me.style.width='4.5%';me.style.opacity='0'},260)});timer=setTimeout(()=>{if(state==='exitClassroom')go('corridorApproach')},1450)}function animateCorridorApproach(){scene('railing');let me=actor('me',25),her=actor('her',40);for(let a of [me,her]){a.classList.add('approaching');a.style.width='12%';a.style.bottom='8%'}let start=performance.now();function tick(now){if(state!=='corridorApproach')return;let t=Math.min(1,(now-start)/1900),ease=t*t*(3-2*t),step=Math.floor((now-start)/140)%4;me.style.left=(25+10*ease)+'%';her.style.left=(40+7*ease)+'%';for(let a of [me,her]){a.style.bottom=(8+16*ease)+'%';a.style.width=(12+4*ease)+'%'}me.style.backgroundPosition=((17+step)/22*100)+'% top';her.style.backgroundPosition=((17+step)/24*100)+'% top';if(t>=1){go('corridorTalk');return}raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}function playLeanTurn(end){let frame=0,delays=[150,110,110,110,110,110,150,650];function show(){if(state!=='hallway')return;bg.src=leanFrames[frame];if(frame===7){timer=setTimeout(end,delays[7]);return}timer=setTimeout(()=>{frame++;show()},delays[frame])}show()}function render(){talk=null;promptAction=null;status.textContent='E 推进；Enter 继续对白';if(state==='sky'){scene('exterior');bg.className='camera-down';lines([['旁白','后来，我们又在学校里有了很多交集。']],()=>go('exterior'));return}if(state==='exterior'){scene('exterior');button('走进教学楼',51,62,()=>go('intro'));return}if(state==='intro'){scene('classroom');actor('me',33).classList.add('sitting');lines([['旁白','课间的教室很吵。我坐在座位上，望着黑板发了一会儿呆。']],()=>go('doorCall'));return}if(state==='doorCall'){scene('classroom');showDoor(true);actor('me',33).classList.add('sitting');actor('her',7).classList.add('at-door','waving');lines([['旁白','咔嗒——教室门被推开了。'],['她','和臣！']],()=>button('转头看向她',13,48,()=>go('meeting')));return}if(state==='meeting'){scene('cg');bg.className='cg-reveal';lines([['旁白','我转过头。她站在门口，笑着朝我挥了挥手。'],['她','和臣，出来一下？'],['我','好，马上来。']],()=>button('起身走到门前',50,80,()=>go('walkToDoor')));return}if(state==='walkToDoor'){scene('classroom');showDoor();actor('her',7).classList.add('at-door');let me=actor('me',33);me.style.bottom='20%';walkActorToDoor(me);return}if(state==='doorArrival'){scene('classroom');showDoor();actor('her',7).classList.add('at-door');let me=actor('me',14.7);me.style.bottom='43%';me.style.backgroundPosition=(2/22*100)+'% top';lines([['旁白','我绕过座位，穿过教室，走到了门前。'],['朱里','走吧。']],()=>button('跟她走出教室',14,58,()=>go('exitClassroom')));return}if(state==='exitClassroom'){animateExitClassroom();return}if(state==='corridorApproach'){animateCorridorApproach();return}if(state==='corridorTalk'){scene('railing');let me=actor('me',35),her=actor('her',47);me.style.backgroundPosition=(4/22*100)+'% top';her.style.backgroundPosition=(4/24*100)+'% top';lines([['朱里','你刚才在教室发呆了？'],['和臣','被你看出来了。'],['朱里','操场那边好像又在踢球。'],['和臣','嗯，隔着窗户也听得见。']],()=>button('靠在护栏上',50,70,()=>go('hallway')));return}if(state==='hallway'){scene('leanTurn');timer=setTimeout(()=>playLeanTurn(()=>lines([['朱里','和臣，我们明天一起画黑板报好不好？']],()=>button('再看一次',50,82,()=>go('intro')))),700);return}if(state==='boardIntro'||state==='board'){go('corridorTalk');return}if(state==='snackIntro'){scene('railing');actor('me',36);actor('her',49);lines([['旁白','又一个课间，我们在走廊碰见。'],['她','吃不吃？'],['我','什么？']],()=>go('snack'));return}if(state==='snack'){scene('railing');actor('me',35);actor('her',48);snacks();return}if(state==='speechIntro'){scene('classroom');actor('me',38);actor('her',53);lines([['旁白','后来，我们又一起准备了广播稿。'],['她','准备好了吗？'],['我','应该吧。'],['她','那开始咯。']],()=>go('speech'));return}if(state==='speech'){scene('classroom');actor('me',38);actor('her',53);broadcast();return}if(state==='montage'){scene('door');actor('me',36);actor('her',50);lines([['旁白','那段时间，我们好像总有很多事情可以一起做。'],['旁白','有时候，我甚至觉得，那些很普通的事情，也变得有意思起来。']],()=>go('walk'));return}if(state==='walk'){scene('railing');walk();return}if(state==='chat'){scene('railing');actor('me',39);actor('her',49);chat();return}if(state==='ending'){scene('railing');actor('me',39);actor('her',49);lines([['旁白','后来想想，那时候的我们，好像总有说不完的话。'],['旁白','一起做的那些事，其实都很普通。'],['旁白','可我开始越来越期待，下一次见到她。']],()=>go('flashback'));return}if(state==='flashback'){scene('classroom');let p=panel('回忆闪回','教室门口、她递来的粉笔、一起分享的零食、广播时接上的那句话，还有走廊里的一段安静。');add(p,'继续',()=>go('end'));return}if(state==='end'){bg.hidden=true;ui.innerHTML='<div class="end"><small>也是在那些日子里……</small><div>我慢慢喜欢上了她。</div><small>CHAPTER 02 / END<br>那些一起度过的日子</small></div>';button('重新体验',50,85,()=>go('sky'))}}
function blackboard(){let p=document.createElement('div');p.className='board-ui';p.innerHTML='<b>一起完成的黑板</b><p>直接在教室黑板上画；她会补上角落的装饰。</p>';ui.append(p);let colors=row(p),paint='#f6db9e',history=[],redo=[],marks=0,draw=false;for(let [name,c] of [['白','#f4ecdd'],['黄','#f6db9e'],['粉','#efaab4'],['蓝','#9acbdf']])add(colors,name,()=>paint=c);let cv=document.createElement('canvas');cv.width=384;cv.height=216;cv.className='board-in-room';ui.append(cv);let c=cv.getContext('2d');c.fillStyle='#285147';c.fillRect(0,0,384,216);if(boardImage){let im=new Image();im.onload=()=>c.drawImage(im,0,0);im.src=boardImage}function snapshot(){history.push(cv.toDataURL());if(history.length>30)history.shift();redo=[]}function restore(s){let im=new Image();im.onload=()=>c.drawImage(im,0,0);im.src=s}function point(e){let r=cv.getBoundingClientRect();return[(e.clientX-r.left)*384/r.width,(e.clientY-r.top)*216/r.height]}cv.onpointerdown=e=>{snapshot();draw=true;marks++;cv.setPointerCapture(e.pointerId);c.strokeStyle=paint;c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(...point(e))};cv.onpointermove=e=>{if(draw){c.lineTo(...point(e));c.stroke()}};cv.onpointerup=()=>draw=false;let tools=row(p);add(tools,'撤销',()=>{if(history.length){redo.push(cv.toDataURL());restore(history.pop())}});add(tools,'重做',()=>{if(redo.length){history.push(cv.toDataURL());restore(redo.pop())}});add(tools,'添加边框',()=>{snapshot();c.strokeStyle=paint;c.lineWidth=4;c.strokeRect(15,15,354,186);marks++});add(tools,'一起完成',()=>{if(!marks&&!boardImage){status.textContent='先画一些内容或添加边框';return}c.strokeStyle='#f1a9b2';for(let [x,y] of [[25,25],[359,25],[25,191],[359,191]]){c.beginPath();c.arc(x,y,9,0,7);c.stroke()}boardImage=cv.toDataURL();persist();lines([['她','这样就差不多啦。'],['我','还挺好看的。']],()=>go('snackIntro'))})}
function snacks(){let p=panel('分你一点','选择自己的一份零食递给她。物品和对白是占位，可按真实记忆修改。');let r=row(p);for(let item of ['饼干','糖果','面包']){let b=add(r,item,()=>{snack=item;[...r.children].forEach(x=>x.classList.toggle('selected',x===b))})}add(p,'递给她',()=>{if(!snack){status.textContent='先选一份零食';return}lines([['她','这个给你。'],['我','那我们一起吃。']],()=>go('speechIntro'))})}
function broadcast(){let p=panel('我们的声音','轮到“我”时，在光标接近绿色区域按空格或点击“接上”。错过时她会自然接续。广播空间的专用美术待制作。');let script=[['我','今天的校园，仍有很多普通的小事。'],['她','有些事，因为有人一起做而不同。'],['我','我们想把这份日常分享给大家。'],['她','谢谢收听。']],index=0,start=0,active=false;let sentence=document.createElement('h2'),track=document.createElement('div');track.className='track';track.innerHTML='<div class="cursor"></div>';p.append(sentence,track);let cur=track.firstChild,feedback=document.createElement('p');p.append(feedback);let b=add(p,'接上（空格）',()=>{if(!active)return;let t=(performance.now()-start)/3000;active=false;cancelAnimationFrame(raf);if(t<.44||t>.56)miss++;feedback.textContent=t>=.44&&t<=.56?'刚好接上。':'有一点停顿，但你们继续了。';index++;timer=setTimeout(advance,700)});b.id='speechButton';function advance(){if(index===script.length){lines([['我','终于结束了。'],['她','还好吧。']],()=>go('montage'));return}let [who,text]=script[index];sentence.textContent=who+'：'+text;if(who==='她'){feedback.textContent='她接续下一句。';index++;timer=setTimeout(advance,1100);return}feedback.textContent='轮到你了。';start=performance.now();active=true;function tick(now){if(state!=='speech'||!active)return;let t=(now-start)/3000;cur.style.left=Math.min(1,t)*100+'%';if(t>=1){active=false;miss++;feedback.textContent='你停顿了一下，她帮你接上。';index++;timer=setTimeout(advance,800)}else raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}advance()}
function walk(){let me=actor('me',walking||35),her=actor('her',follow||49);let p=panel('再待一会儿','沿走廊走一小段。你停下时，她会慢慢停在旁边。');p.style.inset='auto 5% 3%';p.style.height='auto';let r=row(p);add(r,'向左走',()=>move(-5));add(r,'向右走',()=>move(5));add(r,'停下来',()=>{follow=walking+10;her.style.left=follow+'%';status.textContent='她看见你停下，也走回了你身边。'});add(r,'靠着护栏聊天',()=>go('chat'));function move(dx){walking=Math.min(80,Math.max(10,(walking||35)+dx));me.style.left=walking+'%';timer=setTimeout(()=>{follow=walking+10;her.style.left=follow+'%'},320)}window.walkMove=move}
function chat(){let p=panel('再待一会儿','可以聊，也可以什么都不说。对白目前是占位稿。'),r=row(p),reply=document.createElement('p');p.append(reply);for(let [name,text] of [['今天发生的事','今天还挺累的。——是有一点。'],['一起做过的活动','刚才的事，还挺有意思。'],['学校里看到的事','操场那边好像还很热闹。'],['暂时不说话','你们安静地靠着护栏，听着远处的声音。']])add(r,name,()=>{reply.textContent=text;if(!p.querySelector('.finish')){let b=add(p,'再待一会儿',()=>go('ending'));b.className='finish'}})}
document.getElementById('restart').onclick=()=>{if(confirm('从第二幕开头重新开始？')){localStorage.removeItem(KEY);boardImage='';snack='';go('sky')}};document.getElementById('pause').onclick=()=>{paused=!paused;document.body.classList.toggle('paused',paused);document.getElementById('pause').textContent=paused?'继续':'暂停'};window.onkeydown=e=>{if(e.key==='Escape'){document.getElementById('pause').click();return}if(paused)return;if((e.key==='e'||e.key==='E')&&!e.repeat){if(talk){talk.click();return}if(state==='walkToDoor'){e.preventDefault();window.doorAdvance?.();return}if(promptAction){e.preventDefault();const fn=promptAction;promptAction=null;fn();return}}if(e.key==='Enter'&&talk){talk.click();return}if(e.key===' '&&state==='speech'){e.preventDefault();document.getElementById('speechButton')?.click()}if(state==='walkToDoor'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s','A','D','W','S'].includes(e.key)){e.preventDefault();let dir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'}[e.key.toLowerCase().startsWith('arrow')?e.key:e.key.toLowerCase()];window.doorMove?.(dir);return}if(state==='walk'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();window.walkMove?.(e.key==='ArrowLeft'?-5:5)}};try{let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.state){state=s.state;boardImage=s.boardImage||'';snack=s.snack||'';miss=s.miss||0}}catch{}render();
</script></body></html>
